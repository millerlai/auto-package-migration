repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]

  # Mirror the CI "Lint (ruff + black)" job locally.
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Same scope as ci.yml's mypy step.
        files: ^(package-upgrade/scripts/(python|common)/[^/]+\.py|grant_permissions\.py)$
        additional_dependencies: [types-requests]

  # Cross-platform shellcheck (ships win/mac/linux binaries) for all *.sh.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
